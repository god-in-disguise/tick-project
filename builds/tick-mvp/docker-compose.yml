x-backend-env: &backend-env
  - path: .env.example
  - path: .env
    required: false

services:
  api:
    build:
      context: ./backend
    env_file: *backend-env
    command: uvicorn tick_mvp.app:app --host 0.0.0.0 --port 8787
    ports:
      - "8787:8787"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    env_file: *backend-env
    command: python -m tick_mvp.worker worker
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  market-feed:
    build:
      context: ./backend
    env_file: *backend-env
    command: python -m tick_mvp.worker market-feed
    depends_on:
      - redis
    restart: unless-stopped

  venue-events:
    build:
      context: ./backend
    env_file: *backend-env
    command: python -m tick_mvp.worker venue-events
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tick
      POSTGRES_USER: tick
      POSTGRES_PASSWORD: tick
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
